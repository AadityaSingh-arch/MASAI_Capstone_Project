<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TaskFlow — Dark Store Ops</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div id="init-banner" class="init-banner" role="alert" hidden>
    <span id="init-banner-message"></span>
    <button type="button" id="init-retry-btn" class="btn btn--ghost">Retry</button>
  </div>
  <div id="loading-bar" class="loading-bar" hidden aria-hidden="true"></div>

  <header class="app-header">
    <div class="app-header__brand">
      <span class="app-header__mark">TF</span>
      <div>
        <h1>TaskFlow</h1>
        <p class="app-header__tagline">Dark-store engineering pods, one board.</p>
      </div>
    </div>
    <div class="app-header__controls">
      <label for="project-select" class="visually-hidden">Project</label>
      <select id="project-select"></select>
    </div>
  </header>

  <main class="app-main">
    <section class="stats-bar" id="stats-bar" aria-live="polite">
      <div class="stats-bar__card">
        <span class="stats-bar__value" id="stat-total">–</span>
        <span class="stats-bar__label">Tasks</span>
      </div>
      <div class="stats-bar__card">
        <span class="stats-bar__value" id="stat-todo">–</span>
        <span class="stats-bar__label">To do</span>
      </div>
      <div class="stats-bar__card">
        <span class="stats-bar__value" id="stat-in_progress">–</span>
        <span class="stats-bar__label">In progress</span>
      </div>
      <div class="stats-bar__card">
        <span class="stats-bar__value" id="stat-done">–</span>
        <span class="stats-bar__label">Done</span>
      </div>
    </section>

    <div class="split-layout">
      <!-- LEFT: task creation -->
      <section class="panel panel--sticky split-layout__left" id="add-task-panel">
        <h2 class="panel__title">Add a task</h2>
        <form id="add-task-form" novalidate>
          <div class="field">
            <label for="task-title">Title</label>
            <input type="text" id="task-title" name="title" placeholder="e.g. Restock chiller aisle 3" autocomplete="off" disabled />
            <span class="field__error" id="title-error" role="alert"></span>
          </div>
          <div class="field">
            <label for="task-due">Due date</label>
            <input type="date" id="task-due" name="due_date" disabled />
            <span class="field__error" id="due-error" role="alert"></span>
          </div>
          <div class="field">
            <label for="task-priority">Priority</label>
            <select id="task-priority" name="priority" disabled>
              <option value="low">Low</option>
              <option value="medium" selected>Medium</option>
              <option value="high">High</option>
            </select>
          </div>
          <button type="submit" class="btn btn--primary" id="add-task-submit" disabled>Add task</button>
        </form>

        <div class="panel__divider" role="separator"></div>

        <h2 class="panel__title">Quick-add (AI)</h2>
        <form id="quick-add-form" novalidate>
          <div class="field">
            <label for="quick-add-text">Describe the task in one sentence</label>
            <input type="text" id="quick-add-text" name="description"
                   placeholder="e.g. Fix the freezer sensor, it's urgent" autocomplete="off" disabled />
          </div>
          <button type="submit" class="btn btn--accent" id="quick-add-submit" disabled>Parse &amp; add</button>
        </form>
      </section>

      <!-- RIGHT: sorting + task list -->
      <section class="panel split-layout__right">
        <div class="panel__title-row">
          <h2 class="panel__title">Tasks</h2>
          <label for="sort-select" class="visually-hidden">Sort by</label>
          <select id="sort-select">
            <option value="">Unsorted</option>
            <option value="priority">Sort: priority</option>
            <option value="due_date">Sort: due date</option>
          </select>
        </div>
        <div class="search-box">
          <input type="text" id="search-input" placeholder="Search exact title…" autocomplete="off" />
          <select id="search-algo">
            <option value="binary">binary</option>
            <option value="linear">linear</option>
          </select>
          <button type="button" id="search-btn" class="btn btn--ghost">Find</button>
          <button type="button" id="search-clear-btn" class="btn btn--ghost">Clear</button>
        </div>
        <p class="empty-state" id="empty-state" hidden>No tasks yet — add one above to get started.</p>
        <ul id="task-list" class="task-list" aria-live="polite"></ul>
      </section>
    </div>
  </main>

  <div id="toast-container" class="toast-container" aria-live="polite"></div>

  <script src="script.js"></script>
</body>
</html>
